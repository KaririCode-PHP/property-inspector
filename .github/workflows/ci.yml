name: CI

# Spec V4.3.3 §29.1 quality gate and §32 supply chain (ADR-007).
# Actions are pinned by full commit SHA because tags can be moved
# (GHSA-mrrh-fwg8-r2c3 / CVE-2025-30066). The comment keeps the tag readable.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality gate (PHP 8.4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: mbstring, xml
          coverage: pcov
          tools: composer:v2

      - name: Install from composer.lock
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Quality gate (cs, phpstan, psalm, complexity, tests, conformance, security)
        run: composer quality

      - name: Mutation testing (MSI >= 80%)
        run: composer infection

      - name: SBOM (CycloneDX 1.5)
        run: composer sbom
