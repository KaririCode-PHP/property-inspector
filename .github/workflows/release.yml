name: Release

# Publishes a GitHub release for a version tag after the full gate passes.
# The release body is the tag's section of CHANGELOG.md; the job fails without one.
# Actions pinned by commit SHA (§32, ADR-007). Tags must be signed (git tag -s).

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Gate and release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: mbstring, xml
          coverage: pcov
          tools: composer:v2

      - name: Install from composer.lock
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Quality gate
        run: composer quality

      - name: Mutation testing
        run: composer infection

      - name: SBOM
        run: composer sbom

      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" 'index($0, "## [" v "]") == 1 {found = 1; next} found && /^## \[/ {exit} found' CHANGELOG.md > build/release-notes.md
          test -s build/release-notes.md || { echo "CHANGELOG.md has no section for $version"; exit 1; }

      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          body_path: build/release-notes.md
          generate_release_notes: true
          files: build/sbom.cdx.json
